<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <rect width="1200" height="630" fill="#0a0a0a" />
  
  <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05" />
  </pattern>
  <rect width="1200" height="630" fill="url(#dotGrid)" />

  <g font-family="monospace" fill="#888">
    <rect x="250" y="150" width="700" height="350" rx="12" fill="#111" stroke="#333" stroke-width="2" />
    
    <!-- Sidebar -->
    <rect x="250" y="150" width="200" height="350" rx="12" fill="#161616" stroke="#333" stroke-width="2" />
    <text x="280" y="200" fill="#fff" font-size="16" font-weight="bold">TuxPages</text>
    <text x="280" y="240" font-size="14">Publishing</text>
    <text x="280" y="280" font-size="14">Auth / Sessions</text>
    <text x="280" y="320" font-size="14">Content Mgmt</text>
    
    <!-- Editor Area -->
    <rect x="490" y="190" width="420" height="24" rx="4" fill="#222" />
    <rect x="490" y="240" width="380" height="12" rx="4" fill="#222" />
    <rect x="490" y="270" width="400" height="12" rx="4" fill="#222" />
    <rect x="490" y="300" width="300" height="12" rx="4" fill="#222" />
    
    <!-- Badges -->
    <rect x="490" y="420" width="120" height="30" rx="4" fill="#1a1a2e" stroke="#445588" stroke-width="1" />
    <text x="550" y="440" fill="#8899cc" font-size="12" text-anchor="middle">PostgreSQL</text>
    
    <rect x="630" y="420" width="120" height="30" rx="4" fill="#2e1a1a" stroke="#884444" stroke-width="1" />
    <text x="690" y="440" fill="#cc8888" font-size="12" text-anchor="middle">SMTP / TLS</text>
  </g>
</svg>
