<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <rect width="1200" height="630" fill="#0a0a0a" />
  
  <!-- Grid background for technical feel -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="none" stroke="#ffffff" stroke-opacity="0.03" />
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" />

  <g font-family="monospace" font-size="14" fill="#888888">
    <!-- Components -->
    <!-- Parser / Planner -->
    <rect x="100" y="150" width="200" height="80" rx="8" fill="#141414" stroke="#333" stroke-width="2" />
    <text x="200" y="190" fill="#fff" font-size="16" text-anchor="middle" font-weight="bold">Query Parser</text>
    <text x="200" y="210" text-anchor="middle">SQL &#8594; Plan</text>

    <!-- Execution -->
    <rect x="100" y="300" width="200" height="80" rx="8" fill="#141414" stroke="#333" stroke-width="2" />
    <text x="200" y="340" fill="#fff" font-size="16" text-anchor="middle" font-weight="bold">Execution Engine</text>
    <text x="200" y="360" text-anchor="middle">Hash Join / Filter</text>

    <!-- Buffer Manager -->
    <rect x="500" y="225" width="200" height="80" rx="8" fill="#141414" stroke="#445588" stroke-width="2" />
    <text x="600" y="265" fill="#fff" font-size="16" text-anchor="middle" font-weight="bold">Buffer Manager</text>
    <text x="600" y="285" text-anchor="middle">Page Cache / Eviction</text>

    <!-- Storage / Heap -->
    <rect x="900" y="150" width="200" height="80" rx="8" fill="#141414" stroke="#333" stroke-width="2" />
    <text x="1000" y="190" fill="#fff" font-size="16" text-anchor="middle" font-weight="bold">Storage Engine</text>
    <text x="1000" y="210" text-anchor="middle">Heap Files / Pages</text>

    <!-- B+ Tree -->
    <rect x="900" y="300" width="200" height="80" rx="8" fill="#141414" stroke="#333" stroke-width="2" />
    <text x="1000" y="340" fill="#fff" font-size="16" text-anchor="middle" font-weight="bold">B+ Tree Index</text>
    <text x="1000" y="360" text-anchor="middle">Fast Lookups</text>

    <!-- WAL -->
    <rect x="500" y="450" width="600" height="60" rx="8" fill="#141414" stroke="#884444" stroke-width="2" stroke-dasharray="6,4" />
    <text x="800" y="485" fill="#fff" font-size="16" text-anchor="middle" font-weight="bold">Write-Ahead Log (WAL)</text>
    <text x="800" y="500" font-size="12" text-anchor="middle">Atomicity &amp; Durability Recovery</text>

    <!-- Connections -->
    <path d="M200 230 L200 300" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path d="M300 340 L500 265" stroke="#555" stroke-width="2" fill="none" />
    <path d="M700 265 L900 190" stroke="#555" stroke-width="2" fill="none" />
    <path d="M700 265 L900 340" stroke="#555" stroke-width="2" fill="none" />
    <path d="M600 305 L600 450" stroke="#884444" stroke-width="2" stroke-dasharray="4,4" fill="none" />
  </g>
</svg>
