    <text x="230" y="320" font-size="14" text-anchor="middle">OS / Harware</text>

    <path d="M 310 300 L 450 300" stroke="#555" stroke-width="2" marker-end="url(#arrow)" fill="none" />
    <text x="380" y="290" font-size="12" text-anchor="middle">Reseeding</text>

    <rect x="450" y="220" width="300" height="160" rx="12" fill="#141414" stroke="#884444" stroke-width="2" />
