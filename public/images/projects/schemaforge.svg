<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <rect width="1200" height="630" fill="#080c14" />
  
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="none" stroke="#3b82f6" stroke-opacity="0.05" />
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
    </marker>
  </defs>

  <g font-family="monospace">
    <!-- Title Badge -->
    <rect x="80" y="40" width="340" height="36" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="100" y="63" fill="#60a5fa" font-size="14" font-weight="bold">SCHEMAFORGE // AST AGENT</text>

    <!-- Root Agent -->
    <rect x="80" y="110" width="300" height="90" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
    <text x="230" y="145" fill="#f8fafc" font-size="16" text-anchor="middle" font-weight="bold">TrueForge Root Agent</text>
    <text x="230" y="170" fill="#94a3b8" font-size="13" text-anchor="middle">DeepSeek-v4 / Orchestrator</text>

    <!-- Parallel Subagents -->
    <rect x="80" y="250" width="220" height="75" rx="8" fill="#111c33" stroke="#60a5fa" stroke-width="1.5" />
    <text x="190" y="282" fill="#38bdf8" font-size="14" text-anchor="middle" font-weight="bold">DB Analysis Agent</text>
    <text x="190" y="304" fill="#94a3b8" font-size="12" text-anchor="middle">PostgreSQL MCP / EXPLAIN</text>

    <rect x="80" y="350" width="220" height="75" rx="8" fill="#111c33" stroke="#60a5fa" stroke-width="1.5" />
    <text x="190" y="382" fill="#38bdf8" font-size="14" text-anchor="middle" font-weight="bold">Code Analysis Agent</text>
    <text x="190" y="404" fill="#94a3b8" font-size="12" text-anchor="middle">Python AST + sqlparse</text>

    <!-- Impact Graph -->
    <rect x="460" y="220" width="280" height="120" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
    <text x="600" y="255" fill="#c084fc" font-size="16" text-anchor="middle" font-weight="bold">Deterministic Engine</text>
    <text x="600" y="280" fill="#e2e8f0" font-size="13" text-anchor="middle">AST Impact Graph</text>
    <text x="600" y="305" fill="#94a3b8" font-size="11" text-anchor="middle">Tables &#8594; Models &#8594; Endpoints</text>

    <!-- Sandbox -->
    <rect x="460" y="390" width="280" height="90" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <text x="600" y="425" fill="#34d399" font-size="15" text-anchor="middle" font-weight="bold">Daytona Sandbox Engine</text>
    <text x="600" y="450" fill="#94a3b8" font-size="12" text-anchor="middle">Alembic Upgrade &amp; Parity Check</text>

    <!-- Human Gate -->
    <rect x="860" y="220" width="260" height="110" rx="10" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" />
    <text x="990" y="255" fill="#fbbf24" font-size="16" text-anchor="middle" font-weight="bold">THE GATE (Human)</text>
    <text x="990" y="280" fill="#fcd34d" font-size="13" text-anchor="middle">Safety Approval Check</text>
    <text x="990" y="305" fill="#94a3b8" font-size="11" text-anchor="middle">Atomic 1-Tx Rollback Guard</text>

    <!-- Zero-Downtime Prod -->
    <rect x="860" y="380" width="260" height="100" rx="10" fill="#064e3b" stroke="#22c55e" stroke-width="2" />
    <text x="990" y="420" fill="#86efac" font-size="16" text-anchor="middle" font-weight="bold">Zero-Downtime Apply</text>
    <text x="990" y="445" fill="#bbf7d0" font-size="12" text-anchor="middle">Backward-Compatible Views</text>

    <!-- Flow Connectors -->
    <path d="M 230 200 L 230 250" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path d="M 300 287 L 460 280" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path d="M 300 387 L 460 300" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path d="M 600 340 L 600 390" stroke="#a855f7" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path d="M 740 275 L 860 275" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <path d="M 990 330 L 990 380" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  </g>
</svg>
