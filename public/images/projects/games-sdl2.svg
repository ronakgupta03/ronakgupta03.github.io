<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <rect width="1200" height="630" fill="#0a0a0a" />
  
  <pattern id="squares" width="60" height="60" patternUnits="userSpaceOnUse">
    <rect width="60" height="60" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
  </pattern>
  <rect width="1200" height="630" fill="url(#squares)" />

  <g font-family="monospace" fill="#888">
    <rect x="300" y="100" width="600" height="430" rx="4" fill="#111" stroke="#333" stroke-width="2" />
    <rect x="300" y="100" width="600" height="40" fill="#1a1a1a" />
    <circle cx="330" cy="120" r="6" fill="#444" />
    <circle cx="350" cy="120" r="6" fill="#444" />
    <circle cx="370" cy="120" r="6" fill="#444" />
    <text x="600" y="125" fill="#aaa" font-size="14" text-anchor="middle">SDL_Window</text>

    <!-- Game loop diagram inside -->
    <rect x="400" y="200" width="400" height="250" rx="8" fill="none" stroke="#445588" stroke-width="2" stroke-dasharray="4,4" />
    <text x="600" y="240" fill="#fff" font-size="20" font-weight="bold" text-anchor="middle">Main Game Loop</text>
    
    <text x="600" y="290" font-size="16" text-anchor="middle">1. Input &amp; Events</text>
    <text x="600" y="330" font-size="16" text-anchor="middle">2. Update State &amp; Memory</text>
    <text x="600" y="370" font-size="16" text-anchor="middle">3. Render Frame</text>

    <text x="600" y="490" fill="#66aa66" font-size="14" text-anchor="middle">Tic-Tac-Toe • 2D Platformer</text>
  </g>
</svg>
